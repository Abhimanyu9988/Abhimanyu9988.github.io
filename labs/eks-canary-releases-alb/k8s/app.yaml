apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels: {app: demo, version: v1}
  template:
    metadata:
      labels: {app: demo, version: v1}
    spec:
      containers:
        - name: web
          image: public.ecr.aws/docker/library/busybox:1.36.1
          command: ["sh", "-c", "mkdir -p /www && echo version-v1 > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo, version: v2}
  template:
    metadata:
      labels: {app: demo, version: v2}
    spec:
      containers:
        - name: web
          image: public.ecr.aws/docker/library/busybox:1.36.1
          command: ["sh", "-c", "mkdir -p /www && echo version-v2 > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: app-v1
  namespace: demo
spec:
  selector: {app: demo, version: v1}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-v2
  namespace: demo
spec:
  selector: {app: demo, version: v2}
  ports:
    - port: 80
      targetPort: 8080
---
# The "before" way to split traffic: one Service over both versions.
# The split is whatever the pod counts happen to be.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: demo
spec:
  selector: {app: demo}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: tester
  namespace: demo
spec:
  containers:
    - name: busybox
      image: public.ecr.aws/docker/library/busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
