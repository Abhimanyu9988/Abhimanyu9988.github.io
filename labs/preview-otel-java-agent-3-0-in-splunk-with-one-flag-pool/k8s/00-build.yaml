apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-src
  namespace: demo
data:
  pom.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <project xmlns="http://maven.apache.org/POM/4.0.0"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
      <modelVersion>4.0.0</modelVersion>
      <parent>
        <groupId>org.springframework.boot</groupId>
        <artifactId>spring-boot-starter-parent</artifactId>
        <version>3.5.6</version>
        <relativePath/>
      </parent>
      <groupId>lab</groupId>
      <artifactId>app</artifactId>
      <version>1.0.0</version>
      <properties>
        <java.version>21</java.version>
      </properties>
      <dependencies>
        <dependency>
          <groupId>org.springframework.boot</groupId>
          <artifactId>spring-boot-starter-web</artifactId>
        </dependency>
        <dependency>
          <groupId>org.springframework.boot</groupId>
          <artifactId>spring-boot-starter-jdbc</artifactId>
        </dependency>
        <dependency>
          <groupId>org.postgresql</groupId>
          <artifactId>postgresql</artifactId>
          <scope>runtime</scope>
        </dependency>
      </dependencies>
      <build>
        <finalName>app</finalName>
        <plugins>
          <plugin>
            <groupId>org.springframework.boot</groupId>
            <artifactId>spring-boot-maven-plugin</artifactId>
          </plugin>
        </plugins>
      </build>
    </project>
  App.java: |
    package lab;

    import java.util.ArrayList;
    import java.util.Collections;
    import java.util.List;
    import java.util.Map;
    import java.util.concurrent.atomic.AtomicLong;
    import org.springframework.beans.factory.annotation.Value;
    import org.springframework.boot.SpringApplication;
    import org.springframework.boot.autoconfigure.SpringBootApplication;
    import org.springframework.jdbc.core.JdbcTemplate;
    import org.springframework.web.bind.annotation.GetMapping;
    import org.springframework.web.bind.annotation.PathVariable;
    import org.springframework.web.bind.annotation.RestController;
    import org.springframework.web.client.RestClient;

    @SpringBootApplication
    @RestController
    public class App {
      private final JdbcTemplate jdbc;
      private final RestClient inventory;
      private final AtomicLong calls = new AtomicLong();
      private final List<Double> timings = new ArrayList<>();
      private long timedMinute;

      public App(JdbcTemplate jdbc, RestClient.Builder builder, @Value("${inventory.url}") String url) {
        this.jdbc = jdbc;
        this.inventory = builder.baseUrl(url).build();
      }

      public static void main(String[] args) {
        SpringApplication.run(App.class, args);
      }

      @GetMapping("/orders/{id}")
      public Map<String, Object> order(@PathVariable("id") long id) {
        jdbc.queryForObject("select count(*) from audit", Long.class);
        Map<?, ?> stock = inventory.get().uri("/stock/{id}", id).retrieve().body(Map.class);
        return Map.of("order", id, "stock", stock);
      }

      // A timer outside the histogram: one line a minute with the real p95 of the known statement's JDBC call.
      private synchronized void timed(double ms) {
        long minute = System.currentTimeMillis() / 60000;
        if (minute != timedMinute && !timings.isEmpty()) {
          Collections.sort(timings);
          System.out.printf("KNOWN minute_epoch=%d calls=%d p95_ms=%.2f max_ms=%.2f%n", timedMinute * 60, timings.size(),
              timings.get((int) (timings.size() * 0.95)), timings.get(timings.size() - 1));
          timings.clear();
        }
        timedMinute = minute;
        timings.add(ms);
      }

      // Three statements here and one in orders. Every fourth request runs the statement with a known 30 ms in it.
      @GetMapping("/stock/{id}")
      public Map<String, Object> stock(@PathVariable("id") long id) {
        long row = id % 100 + 1;
        jdbc.update("update stock set qty = qty where id = ?", row);
        if (calls.incrementAndGet() % 4 == 0) {
          long start = System.nanoTime();
          jdbc.queryForList("select pg_sleep(0.03), qty from reserved where id = ?", row);
          timed((System.nanoTime() - start) / 1e6);
        }
        return jdbc.queryForMap("select sku, qty from stock where id = ?", row);
      }
    }
---
# Builds the jar once and fetches the agent once. Both land on the app node, so every run uses the same files.
apiVersion: batch/v1
kind: Job
metadata:
  name: build
  namespace: demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  template:
    spec:
      restartPolicy: Never
      nodeName: APP_NODE
      volumes:
        - name: src
          configMap:
            name: app-src
        - name: lab
          hostPath:
            path: /opt/lab
            type: DirectoryOrCreate
      initContainers:
        - name: fetch-agent
          image: python:3.12-slim
          volumeMounts:
            - { name: lab, mountPath: /lab }
          command:
            - python
            - -c
            - |
              import time, urllib.request
              url = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.33.1/opentelemetry-javaagent.jar"
              for attempt in range(1, 13):
                  try:
                      urllib.request.urlretrieve(url, "/lab/opentelemetry-javaagent.jar")
                      print("agent downloaded on attempt", attempt)
                      break
                  except Exception as e:
                      print("download attempt", attempt, "failed:", e)
                      time.sleep(10)
              else:
                  raise SystemExit("the agent could not be downloaded")
      containers:
        - name: build
          image: maven:3.9.9-eclipse-temurin-21
          volumeMounts:
            - { name: src, mountPath: /src }
            - { name: lab, mountPath: /lab }
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /w/src/main/java/lab
              cp /src/pom.xml /w/pom.xml
              cp /src/App.java /w/src/main/java/lab/App.java
              cd /w
              mvn -q -B -DskipTests package
              cp target/app.jar /lab/app.jar
              ls -l /lab
