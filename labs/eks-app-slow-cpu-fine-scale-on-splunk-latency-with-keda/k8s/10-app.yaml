apiVersion: v1
kind: ConfigMap
metadata:
  name: latency-app-code
  namespace: demo
data:
  app.py: |
    import json
    import os
    import socket
    import threading
    import time
    from collections import deque
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    # I/O-bound service: every request needs a "backend slot" for WORK seconds
    # (a sleep, so almost no CPU). Only WORKERS slots exist per pod, so when
    # traffic grows requests queue up and latency rises while CPU stays low.
    WORKERS = int(os.environ.get("WORKERS", "4"))
    WORK = float(os.environ.get("WORK_SECONDS", "0.2"))
    WINDOW = 10.0

    slots = threading.Semaphore(WORKERS)
    lock = threading.Lock()
    samples = deque()
    state = {"total": 0}


    def record(seconds):
        with lock:
            samples.append((time.time(), seconds))
            state["total"] += 1


    def avg_ms():
        cutoff = time.time() - WINDOW
        with lock:
            while samples and samples[0][0] < cutoff:
                samples.popleft()
            if not samples:
                return 0.0
            return 1000.0 * sum(s for _, s in samples) / len(samples)


    class Server(ThreadingHTTPServer):
        request_queue_size = 256
        daemon_threads = True


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def reply(self, code, body, ctype="text/plain"):
            data = body.encode()
            try:
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            except Exception:
                pass

        def do_GET(self):
            if self.path == "/healthz":
                self.reply(200, "ok\n")
            elif self.path == "/metrics":
                body = (
                    "# HELP app_request_latency_ms Mean request latency over the last 10 seconds\n"
                    "# TYPE app_request_latency_ms gauge\n"
                    'app_request_latency_ms{app="latency-app"} %.1f\n'
                    "# TYPE app_requests_total counter\n"
                    'app_requests_total{app="latency-app"} %d\n'
                ) % (avg_ms(), state["total"])
                self.reply(200, body, "text/plain; version=0.0.4")
            elif self.path == "/stats":
                body = json.dumps({
                    "pod": socket.gethostname(),
                    "avg_latency_ms": round(avg_ms(), 1),
                    "cpu_seconds": time.process_time(),
                    "requests_total": state["total"],
                })
                self.reply(200, body, "application/json")
            else:
                t0 = time.time()
                with slots:
                    time.sleep(WORK)
                record(time.time() - t0)
                self.reply(200, "done\n")


    if __name__ == "__main__":
        Server(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latency-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latency-app
  template:
    metadata:
      labels:
        app: latency-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: public.ecr.aws/docker/library/python:3.12.11-slim
          command: ["python", "-u", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: latency-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: latency-app
  namespace: demo
spec:
  selector:
    app: latency-app
  ports:
    - name: http
      port: 8080
      targetPort: http
