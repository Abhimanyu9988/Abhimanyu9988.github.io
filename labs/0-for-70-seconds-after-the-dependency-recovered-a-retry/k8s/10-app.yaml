# inventory and orders, both on the app node, both run from the virtualenv the build Job made. Zero-code OpenTelemetry:
# opentelemetry-instrument starts each service, and the app code has no tracing in it. RETRY_MODE is the only setting that
# differs between runs; LAB_RUN changes every run so both services always start fresh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory }
  template:
    metadata:
      labels: { app: inventory }
    spec:
      nodeName: APP_NODE
      enableServiceLinks: false   # no ORDERS_PORT-style variables from Services, which would clash with app settings
      volumes:
        - name: lab
          hostPath: { path: /opt/lab }
      containers:
        - name: app
          image: python:3.12-slim
          command: ["/lab/venv/bin/opentelemetry-instrument", "/lab/venv/bin/python", "/lab/app/inventory.py"]
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
            - { name: OTEL_SERVICE_NAME, value: inventory }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(HOST_IP):4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=LAB_ENV,deployment.environment.name=LAB_ENV" }
            - { name: OTEL_METRICS_EXPORTER, value: otlp }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000" }
            - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http }
            - { name: OTEL_LOGS_EXPORTER, value: none }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: THREADS, value: "4" }
            - { name: WORK_MS, value: "40" }
            - { name: LAB_RUN, value: "none" }
          ports:
            - containerPort: 8081
          volumeMounts:
            - { name: lab, mountPath: /lab, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 2
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
spec:
  selector: { app: inventory }
  ports:
    - port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      nodeName: APP_NODE
      enableServiceLinks: false   # no ORDERS_PORT-style variables from Services, which would clash with app settings
      volumes:
        - name: lab
          hostPath: { path: /opt/lab }
      containers:
        - name: app
          image: python:3.12-slim
          command: ["/lab/venv/bin/opentelemetry-instrument", "/lab/venv/bin/python", "/lab/app/orders.py"]
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
            - { name: OTEL_SERVICE_NAME, value: orders }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(HOST_IP):4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=LAB_ENV,deployment.environment.name=LAB_ENV" }
            - { name: OTEL_METRICS_EXPORTER, value: otlp }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000" }
            - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http }
            - { name: OTEL_LOGS_EXPORTER, value: none }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: INVENTORY_URL, value: "http://inventory:8081" }
            - { name: THREADS, value: "400" }
            - { name: RETRY_MODE, value: naive }
            - { name: LAB_RUN, value: "none" }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: lab, mountPath: /lab, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: demo
spec:
  selector: { app: orders }
  ports:
    - port: 8080
