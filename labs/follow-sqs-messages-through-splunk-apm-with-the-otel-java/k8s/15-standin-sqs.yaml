# Free checks only. ElasticMQ stands in for Amazon SQS during the rehearsal, and a real run never applies this file.
# It keeps the AWSTraceHeader system attribute, as SQS does, so the rehearsal takes the agent's default path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqs-standin
  namespace: demo
data:
  elasticmq.conf: |
    include classpath("application.conf")
    node-address {
      protocol = http
      host = "*"
      port = 9324
      context-path = ""
    }
    rest-sqs {
      enabled = true
      bind-port = 9324
      bind-hostname = "0.0.0.0"
      sqs-limits = strict
    }
    queues {
      lab-orders {
        defaultVisibilityTimeout = 30 seconds
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqs
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: sqs }
  template:
    metadata:
      labels: { app: sqs }
    spec:
      nodeName: LOAD_NODE
      volumes:
        - name: conf
          configMap:
            name: sqs-standin
      containers:
        - name: sqs
          image: softwaremill/elasticmq-native:1.7.1
          ports:
            - containerPort: 9324
          volumeMounts:
            - { name: conf, mountPath: /opt/elasticmq.conf, subPath: elasticmq.conf }
          readinessProbe:
            tcpSocket: { port: 9324 }
            periodSeconds: 2
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: sqs
  namespace: demo
spec:
  selector: { app: sqs }
  ports:
    - port: 9324
