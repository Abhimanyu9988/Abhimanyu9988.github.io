# Pods reach the queue as this service account. On EKS, Pod Identity gives it the role from main.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqs-lab
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      nodeName: APP_NODE
      serviceAccountName: sqs-lab
      volumes:
        - name: lab
          hostPath: { path: /opt/lab }
      containers:
        - name: app
          image: maven:3.9.9-eclipse-temurin-21
          command: ["java", "-Xms256m", "-Xmx256m", "-jar", "/lab/app.jar"]
          envFrom:
            - configMapRef: { name: sqs-env }
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
            - { name: SPRING_PROFILES_ACTIVE, value: orders }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: lab, mountPath: /lab, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
            failureThreshold: 90
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: demo
spec:
  selector: { app: orders }
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfilment
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: fulfilment }
  template:
    metadata:
      labels: { app: fulfilment }
    spec:
      nodeName: APP_NODE
      serviceAccountName: sqs-lab
      volumes:
        - name: lab
          hostPath: { path: /opt/lab }
      containers:
        - name: app
          image: maven:3.9.9-eclipse-temurin-21
          command: ["java", "-Xms256m", "-Xmx256m", "-jar", "/lab/app.jar"]
          envFrom:
            - configMapRef: { name: sqs-env }
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
            - { name: SPRING_PROFILES_ACTIVE, value: fulfilment }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: lab, mountPath: /lab, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
            failureThreshold: 90
