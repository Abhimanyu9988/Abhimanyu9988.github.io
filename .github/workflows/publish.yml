name: publish
on:
  push: { branches: [main], paths: ["site/**"] }
  workflow_dispatch:
    inputs:
      preview:
        description: "Send the ready-to-post email for this post (its slug) again, without publishing anything"
        required: false
        type: string
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  preview:
    if: inputs.preview != ''
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: publish-state, path: state, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/publish.py --preview "$SLUG"
        env: { SLUG: "${{ inputs.preview }}" }
      - run: gh issue create --title "$(cat publish-title.txt)" --body-file publish-report.md --assignee Abhimanyu9988
        env: { GH_TOKEN: "${{ github.token }}" }
  deploy-site:
    if: inputs.preview == ''
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # Medium-ready copies (plain HTML Medium's importer understands), built into the site before Jekyll runs.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown==3.10.3 && python pipeline/medium_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./site, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
      - id: d
        uses: actions/deploy-pages@v4
  syndicate:
    needs: deploy-site
    runs-on: ubuntu-latest
    environment: publish
    permissions: { contents: write, issues: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: publish-state, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/publish.py
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
          HASHNODE_API_URL: ${{ vars.HASHNODE_API_URL }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
      - if: always()
        working-directory: state
        run: |
          git config user.name hero-pipeline-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publish-state.json
          git diff --cached --quiet || (git commit -m "publish state" && git push)
      # The "ready to post" email: GitHub emails you every new issue in your repo. Only for new posts.
      - if: always() && hashFiles('publish-report.md') != ''
        run: |
          if [ -s publish-report.md ]; then
            gh issue create --title "$(cat publish-title.txt)" --body-file publish-report.md --assignee Abhimanyu9988
          else
            echo "Only updates to posts that are already out; no email."
          fi
        env: { GH_TOKEN: "${{ github.token }}" }
