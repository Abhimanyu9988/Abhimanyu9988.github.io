name: replicate
# You start a lab: reply "approve" to the topic issue's email (or comment "approve" on it, or add the
# `replicate` label yourself). That reply is the cost/safety gate: the bot's own `replicate` label only marks the
# panel's pick and never starts anything.
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Topic issue number"
        required: true
        type: string
      dry_run:
        description: "Write and review the lab, but don't touch AWS"
        type: boolean
        default: false
      from_run:
        description: "Redraft only: id of an earlier replicate run whose lab output to reuse (no AWS)"
        required: false
        type: string
permissions:
  contents: read
  issues: read
concurrency:
  # One lab at a time. Other label events (radar, drafted, ...) get their own group so they never
  # cancel a queued lab.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'issue_comment' && github.event.comment.user.login == 'Abhimanyu9988' &&
          !github.event.issue.pull_request &&
          (startsWith(github.event.comment.body, 'approve') || startsWith(github.event.comment.body, '/approve'))) ||
         (github.event.label.name == 'replicate' && github.event.sender.login == 'Abhimanyu9988'))
        && 'replicate' || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  # GitHub sometimes delivers the same `replicate` label event twice. The copy would sit waiting for your
  # aws-lab approval and hold the one-lab-at-a-time queue, blocking every later lab and redraft.
  gate:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'replicate' &&
      github.event.sender.login == 'Abhimanyu9988'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { actions: read }
    outputs:
      duplicate: ${{ steps.d.outputs.duplicate }}
    steps:
      - id: d
        env: { GH_TOKEN: "${{ github.token }}", TITLE: "${{ github.event.issue.title }}" }
        run: |
          me=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          # earlier runs for the same issue within 5 minutes whose gate ran (other label events skip it)
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/replicate.yml/runs?event=issues&per_page=50" \
            --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and .display_title == env.TITLE)
                  | select((\"$me\" | fromdateiso8601) - (.created_at | fromdateiso8601) < 300) | .id")
          dup=0
          for id in $ids; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "gate" and .conclusion != "skipped")] | length')
            if [ "$n" -gt 0 ]; then dup=1; fi
          done
          echo "duplicate=$([ "$dup" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$dup" -gt 0 ] && echo "::notice::Same replicate event delivered twice; this copy does nothing." || true
  # A quick reply on the topic issue (it reaches your email) so you know the lab started.
  ack:
    if: >-
      github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io' &&
      github.event_name == 'issue_comment' && github.event.comment.user.login == 'Abhimanyu9988' &&
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, 'approve') || startsWith(github.event.comment.body, '/approve')) &&
      (contains(github.event.issue.labels.*.name, 'radar') || contains(github.event.issue.labels.*.name, 'problem'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { issues: write }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", N: "${{ github.event.issue.number }}" }
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="Approved. The lab is starting now; the draft post usually arrives in 30 to 60 minutes."
  lab:
    needs: gate
    if: >-
      always() && needs.gate.outputs.duplicate != 'true' &&
      github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io' &&
      !inputs.from_run &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.comment.user.login == 'Abhimanyu9988' &&
        !github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, 'approve') || startsWith(github.event.comment.body, '/approve')) &&
        (contains(github.event.issue.labels.*.name, 'radar') || contains(github.event.issue.labels.*.name, 'problem'))) ||
       (github.event.label.name == 'replicate' && github.event.sender.login == 'Abhimanyu9988'))
    runs-on: ubuntu-latest
    environment: aws-lab
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
      id-token: write
    env:
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Terraform and every AI-written script run inside this image, not on the runner.
      - name: build lab sandbox
        if: env.DRY_RUN != 'true'
        timeout-minutes: 10
        run: docker build -q -t hero-lab:local -f pipeline/lab.Dockerfile pipeline
      # Shows who GitHub says this job is (claims only, never the token), as a run annotation.
      # The AWS role trusts exactly repo:<owner>/<repo>:environment:aws-lab.
      - name: show OIDC subject
        if: env.DRY_RUN != 'true'
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
                                       headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          part = json.load(urllib.request.urlopen(req))["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          print("::notice title=OIDC subject::" + json.dumps({k: claims.get(k) for k in ("sub", "aud", "environment", "ref")}))
          PY
      - if: env.DRY_RUN != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          role-session-name: replicate-${{ github.run_id }}
      - name: replicate
        timeout-minutes: 112
        run: python3 pipeline/lab.py
        env:
          SPLUNK_REALM: ${{ vars.SPLUNK_REALM }}
          SPLUNK_ACCESS_TOKEN: ${{ secrets.SPLUNK_ACCESS_TOKEN }}
          SPLUNK_API_TOKEN: ${{ secrets.SPLUNK_API_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RUN_ID: ${{ github.run_id }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # Fresh credentials: the first session may be close to its 2-hour limit by now.
      - if: always() && env.DRY_RUN != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: safety-${{ github.run_id }}
      - name: safety-net destroy
        if: always() && env.DRY_RUN != 'true'
        timeout-minutes: 30
        run: python3 pipeline/lab.py --destroy-only
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RUN_ID: ${{ github.run_id }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab
          path: out/
          retention-days: 30
          if-no-files-found: ignore

  draft:
    needs: lab
    if: >-
      always() && github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io' &&
      (needs.lab.result != 'skipped' || inputs.from_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
    env:
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lab
          path: out
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      # The bot may only create draft/* branches, files under site/_posts and labs/, PRs into main,
      # and comments/labels on issues in this repo. pipeline/radar.py enforces it.
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - run: pip install matplotlib==3.10.7          # draws the cover image
      - name: draft
        run: python3 pipeline/draft.py
        env:
          HERO_PUBLISH: "1"
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
