name: post-review
# ChatGPT and Gemini each pass or block an article and its LinkedIn post against the lab's evidence. Abhi's rule: a
# post is ready only when both approve. It holds no write token, writes nothing, and runs code from main only. A review
# costs a few cents of ChatGPT and Gemini; the monthly budget is checked first, but this job can't record its spend.
on:
  workflow_dispatch:
    inputs:
      article:
        description: "A ShowMerit article slug (content/abhimanyu/articles/<slug>.md)"
        required: false
        type: string
      issue:
        description: "Or a chat topic issue number (chat-work/<issue>/post.json on chat/<issue>)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: pip install -q pyyaml==6.0.3
      - name: clean pass from ChatGPT and Gemini
        run: python3 pipeline/post_review.py
        env:
          ARTICLE: ${{ inputs.article }}
          ISSUE_NO: ${{ inputs.issue }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MODEL_AUTO: ${{ vars.MODEL_AUTO }}
