name: cto
# Your Slack messages every 10 minutes, your replies on the CTO desk issue, a daily refresh of the public team status,
# and the Monday digest. Slack needs no server this way, so an answer can take a few minutes.
# It cannot publish, spend, deploy or start a lab.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "12 7 * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Post the digest now"
        type: boolean
        default: false
      poll:
        description: "Read Slack now. The Slack listener sets this"
        type: boolean
        default: false
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write                       # only to start the Topic Scout for an idea you queued
concurrency: cto
jobs:
  cto:
    if: >-
      github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io' && (github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.comment.user.login == 'Abhimanyu9988' &&
      contains(github.event.issue.labels.*.name, 'cto-desk') && !startsWith(github.event.comment.body, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # The private admin page. Until that repository exists, this step fails quietly and the page is skipped.
      - uses: actions/create-github-app-token@v2
        id: admin
        continue-on-error: true
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: Abhimanyu9988
          repositories: team-admin
          permission-contents: write
      - name: cto
        id: leaders
        run: python3 pipeline/cto.py
        env:
          SCHEDULE: ${{ github.event.schedule }}
          OSS_SCOUT_MODEL: ${{ vars.OSS_SCOUT_MODEL }}
          ADMIN_TOKEN: ${{ steps.admin.outputs.token }}
          MANAGER_MODEL: ${{ vars.MANAGER_MODEL }}
          POLL: ${{ github.event.schedule == '*/10 * * * *' || inputs.poll == true }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DIGEST: ${{ inputs.digest }}
          BUDGET_EXEMPT: "1"
          CTO_MODEL: ${{ vars.CTO_MODEL }}
          CEO_MODEL: ${{ vars.CEO_MODEL }}
          CMO_MODEL: ${{ vars.CMO_MODEL }}
          CFO_MODEL: ${{ vars.CFO_MODEL }}
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
          HERO_PUBLISH: "1"
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      - name: start the Topic Scout
        if: steps.leaders.outputs.run_scout == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref main
  # AWS's own month-to-date figure, once a day. It holds no model key, reads no PR, and uses a role that can only read costs.
  billing:
    if: >-
      github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io' && vars.BILLING_ROLE_ARN != '' &&
      (github.event.schedule == '12 7 * * *' || inputs.digest == true)
    environment: live-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BILLING_ROLE_ARN }}
          aws-region: us-east-1
      - name: read costs
        run: |
          aws ce get-cost-and-usage --granularity MONTHLY --metrics UnblendedCost \
            --time-period "Start=$(date -u +%Y-%m-01),End=$(date -u -d tomorrow +%Y-%m-%d)" > cost.json
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: save
        run: python3 pipeline/budget.py cost.json
        env:
          HERO_PUBLISH: "1"
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
