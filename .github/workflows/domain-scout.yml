name: domain-scout
# Checks candidate domains through public RDAP records and tells the CFO what it finds. It never buys anything.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/create-github-app-token@v2
        id: admin
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: Abhimanyu9988
          repositories: team-admin
          permission-contents: write
      - name: check the names
        run: python3 pipeline/domain_scout.py
        env:
          ADMIN_TOKEN: ${{ steps.admin.outputs.token }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HERO_PUBLISH: "1"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
