name: engineer
# Turns one request from Abhi into a pull request. The first job holds the model key and can't write to GitHub. The second can
# write and has no model key, and it never runs what the first job wrote. He merges the PR, so nothing goes live without him.
on:
  workflow_dispatch:
    inputs:
      request:
        description: "What Abhi asked for"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: engineer
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: work
          persist-credentials: false
      - run: pip install markdown==3.10.3 matplotlib==3.10.7 python-frontmatter pyyaml
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - run: PYTHONPATH=pipeline python3 pipeline/engineer.py build
        env:
          REQUEST: ${{ inputs.request }}
          CTO_MODEL: ${{ vars.CTO_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: change
          path: out
          if-no-files-found: ignore
  finish:
    needs: build
    if: always() && github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: change
          path: out
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - run: PYTHONPATH=pipeline python3 pipeline/engineer.py finish
        env:
          REQUEST: ${{ inputs.request }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HERO_PUBLISH: "1"
          REPO: ${{ github.repository }}
