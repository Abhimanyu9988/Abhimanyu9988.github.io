name: post-proposal
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "radar/problems run that saved the proposal"
        required: true
        type: string
      proposal_id:
        description: "Id of the exact proposal you approved"
        required: true
        type: string
permissions:
  contents: read
  issues: read
  actions: read
concurrency: post-proposal
jobs:
  post:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: proposals
          path: proposals
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write
      - name: post
        run: python3 pipeline/post_proposal.py
        env:
          HERO_PUBLISH: "1"
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
