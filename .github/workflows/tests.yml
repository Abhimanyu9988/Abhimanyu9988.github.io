name: tests
on:
  pull_request:
    paths: ["pipeline/**", "tests/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/test_safety.py
      - run: pip install markdown==3.10.3 matplotlib==3.10.7 python-frontmatter pyyaml
      - run: python3 tests/test_pipeline.py
