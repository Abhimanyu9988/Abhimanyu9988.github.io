name: lab-check
# A free check before a chat lab pays for AWS. See docs/chat-article.md.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Topic issue number, with its lab on branch chat/<issue>"
        required: true
        type: string
permissions:
  contents: read
jobs:
  # Runs the lab's own check.sh. It is written in chat, so this job holds no secrets and no token.
  app:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: unpack the lab
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "the issue must be a number"; exit 1; }
          git fetch -q --depth 1 origin "chat/$ISSUE"
          git show "FETCH_HEAD:chat-work/$ISSUE/lab.json" > lab.json
          python3 pipeline/lab_check.py lab.json work
      - name: run the lab's check
        working-directory: work
        run: bash check.sh
  # Marketing and the Editor review the plan from code on main. The lab's files reach them as data, and nothing from the lab runs here.
  plan-review:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: review the lab plan
        env:
          ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HERO_PUBLISH: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "the issue must be a number"; exit 1; }
          git fetch -q --depth 1 origin "chat/$ISSUE"
          git show "FETCH_HEAD:chat-work/$ISSUE/lab.json" > lab.json
          git show "FETCH_HEAD:chat-work/$ISSUE/plan-review.json" > earlier.json 2>/dev/null || echo '{}' > earlier.json
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > issue.json
          status=0
          python3 pipeline/plan_review.py issue.json lab.json earlier.json review.json || status=$?
          # This round's points go on the lab's branch for the rerun to check. A save that fails only means a full review next time.
          if [ -s review.json ]; then
            path="repos/$GITHUB_REPOSITORY/contents/chat-work/$ISSUE/plan-review.json"
            sha=$(GH_TOKEN="$BOT_TOKEN" gh api "$path?ref=chat/$ISSUE" --jq .sha 2>/dev/null || true)
            jq -n --arg branch "chat/$ISSUE" --arg sha "$sha" --arg content "$(base64 -w0 review.json)" \
              '{message: "Save the plan review points", branch: $branch, content: $content} + (if $sha == "" then {} else {sha: $sha} end)' |
              GH_TOKEN="$BOT_TOKEN" gh api -X PUT "$path" --input - --silent || echo "could not save the plan review points"
          fi
          exit $status
  # Runs the lab's real scripts on a small cluster. Like the lab sandbox, this holds the Splunk tokens and nothing else:
  # no model keys, no GitHub token and no AWS role.
  rehearsal:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    needs: [app, splunk, plan-review]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: unpack the lab
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "the issue must be a number"; exit 1; }
          git fetch -q --depth 1 origin "chat/$ISSUE"
          git show "FETCH_HEAD:chat-work/$ISSUE/lab.json" > lab.json
          python3 pipeline/lab_check.py lab.json work
      - name: rehearse the lab on Kubernetes
        run: bash pipeline/rehearse.sh work
        env:
          SPLUNK_REALM: ${{ vars.SPLUNK_REALM }}
          SPLUNK_ACCESS_TOKEN: ${{ secrets.SPLUNK_ACCESS_TOKEN }}
          SPLUNK_API_TOKEN: ${{ secrets.SPLUNK_API_TOKEN }}
  # Code from main only. Proves a span can be sent to Splunk and read back through the APIs a lab uses.
  splunk:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: aws-lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: send a test trace and read it back
        run: python3 pipeline/splunk_check.py
        env:
          SPLUNK_REALM: ${{ vars.SPLUNK_REALM }}
          SPLUNK_ACCESS_TOKEN: ${{ secrets.SPLUNK_ACCESS_TOKEN }}
          SPLUNK_API_TOKEN: ${{ secrets.SPLUNK_API_TOKEN }}
