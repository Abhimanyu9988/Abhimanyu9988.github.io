name: recheck-aws
# The paid recheck, on the first Tuesday of each month: the labs due that month in a 3-month cycle run on the AWS lab
# account with the newest versions, oldest article first, one after another, so each lab runs once a quarter
# (pipeline/recheck.py `due`). The schedule fires every Tuesday and only the first one runs labs. Each lab starts only if
# the monthly budget has room for it. No model is called. A failed lab is a normal result: it goes to a private issue and
# the verdict job's name, and the run stays green.
on:
  schedule: [{ cron: "23 2 * * 2" }]
  workflow_dispatch:
    inputs:
      lab:
        description: "Article slug to recheck now. Leave empty for this month's labs. Each lab costs about $1"
        required: false
        type: string
permissions:
  contents: read
jobs:
  pick:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      labs: ${{ steps.pick.outputs.labs }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Abhimanyu9988/showmerit
          ref: main
          path: showmerit
          persist-credentials: false
      - name: this month's labs
        id: pick
        env:
          LAB: ${{ inputs.lab }}
          EVENT: ${{ github.event_name }}
        run: python3 pipeline/recheck.py due showmerit "$LAB" "$EVENT"
      - name: their newest versions
        if: steps.pick.outputs.count != '0'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: python3 pipeline/recheck.py plan showmerit plan.json "$SLUGS"
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.count != '0'
        with:
          name: plan
          path: plan.json
          retention-days: 30
  # One lab per job, one job at a time: the lab account runs one lab at a time and its janitor removes anything else.
  # Each job also waits behind any replicate lab. The same runner as a replicate lab: sandbox, sweep, janitor, destroy and
  # safety net. No model keys and no bot token.
  lab:
    needs: pick
    if: needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-latest
    environment: aws-lab
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.labs) }}
    concurrency:
      group: replicate
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SLUG: ${{ matrix.slug }}
      EARLIER: ${{ matrix.earlier }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      # Before each lab, not once per run, so a run stops before the lab that would pass the limit.
      - name: budget
        id: budget
        env:
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 pipeline/recheck.py budget "$SLUG" "$EARLIER" out
      - uses: actions/checkout@v4
        if: steps.budget.outputs.budget == 'ok'
        with:
          repository: Abhimanyu9988/showmerit
          ref: main
          path: showmerit
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.budget.outputs.budget == 'ok'
        with:
          name: plan
      - name: write the lab with the newest versions
        if: steps.budget.outputs.budget == 'ok'
        run: |
          python3 pipeline/recheck.py prepare showmerit plan.json "$SLUG" newest recheck-src recheck-lab.json
          mkdir -p out && echo '{"started": true}' > out/started.json
      - name: build lab sandbox
        if: steps.budget.outputs.budget == 'ok'
        timeout-minutes: 10
        run: docker build -q -t hero-lab:local -f pipeline/lab.Dockerfile pipeline
      - if: steps.budget.outputs.budget == 'ok'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          role-session-name: recheck-${{ github.run_id }}
      - name: recheck on AWS
        if: steps.budget.outputs.budget == 'ok'
        timeout-minutes: 112
        run: python3 pipeline/lab.py --recheck recheck-lab.json
        env:
          SPLUNK_REALM: ${{ vars.SPLUNK_REALM }}
          SPLUNK_ACCESS_TOKEN: ${{ secrets.SPLUNK_ACCESS_TOKEN }}
          SPLUNK_API_TOKEN: ${{ secrets.SPLUNK_API_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RUN_ID: ${{ github.run_id }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      # Fresh credentials: the first session may be close to its 2-hour limit by now.
      - if: always() && steps.budget.outputs.budget == 'ok'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: recheck-safety-${{ github.run_id }}
      - name: safety-net destroy
        if: always() && steps.budget.outputs.budget == 'ok'
        timeout-minutes: 30
        run: python3 pipeline/lab.py --destroy-only
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RUN_ID: ${{ github.run_id }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.slug }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
  # Code from main only. Records the labs' AWS estimates, saves each lab's public result, files a private issue for each
  # failed lab, and lists the labs the budget skipped.
  report:
    needs: [pick, lab]
    if: always() && needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      passed: ${{ steps.report.outputs.passed }}
      failed: ${{ steps.report.outputs.failed }}
      skipped: ${{ steps.report.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lab-*
          path: out
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/create-github-app-token@v2
        id: admin
        continue-on-error: true
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: Abhimanyu9988
          repositories: team-admin
          permission-issues: write
      - name: report
        id: report
        continue-on-error: true
        run: |
          mkdir -p out
          python3 pipeline/recheck.py report aws plan.json out
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HERO_PUBLISH: "1"
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ steps.admin.outputs.token }}
          REPO: ${{ github.repository }}
  verdict:
    name: verdict labs=${{ needs.pick.outputs.count || '0' }} passed=${{ needs.report.outputs.passed || '0' }} failed=${{ needs.report.outputs.failed || '0' }} skipped=${{ needs.report.outputs.skipped || '0' }}
    if: always() && github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    needs: [pick, report]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Read the job name for the result of this recheck."
