name: radar
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency: radar
jobs:
  radar:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: radar
        run: python3 pipeline/radar.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RADAR_MODEL: ${{ vars.RADAR_MODEL }}
      - uses: actions/upload-artifact@v4
        with:
          name: proposals
          path: proposals.json
          retention-days: 14
          if-no-files-found: ignore
