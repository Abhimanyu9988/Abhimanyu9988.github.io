name: radar
on:
  schedule:
    - cron: "0 6 * * 1"     # Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be opened; write nothing"
        type: boolean
        default: false
permissions:
  contents: read
  issues: read
  actions: write                       # only to start the pick's lab below
concurrency: radar
jobs:
  radar:
    if: github.repository == 'Abhimanyu9988/Abhimanyu9988.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The bot writes issues and labels in this repo only; pipeline/radar.py enforces the rules.
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: write
      - name: radar
        id: radar
        run: python3 pipeline/week.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HERO_PUBLISH: "1"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SPLUNK_READY: ${{ vars.SPLUNK_REALM != '' && secrets.SPLUNK_ACCESS_TOKEN != '' && secrets.SPLUNK_API_TOKEN != '' }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_MODEL: ${{ vars.RADAR_MODEL }}
          EDITOR_MODE: ${{ vars.EDITOR_MODE }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL }}
          LAB_CHECK_MODEL: ${{ vars.LAB_CHECK_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MODEL_AUTO: ${{ vars.MODEL_AUTO }}
          GOAL_RANKING: ${{ vars.GOAL_RANKING }}
      # The plan's first topic goes straight to a lab. The monthly budget is the limit. AUTO_LAB=off restores your approve reply.
      - name: start the lab
        if: steps.radar.outputs.pick != '' && vars.AUTO_LAB != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          PICK: ${{ steps.radar.outputs.pick }}
          MODEL: ${{ steps.radar.outputs.pick_model }}
        run: gh workflow run replicate.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$PICK" -f model="$MODEL"
